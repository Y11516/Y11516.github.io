<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 1. 字符编码：防止中文乱码 -->
    <meta charset="UTF-8">
    <!-- 2. 响应式视口：在手机和电脑上都显示完美 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 3. 浏览器标签栏标题 -->
    <title>Y11516 · 网安实验室</title>
    
    <!-- 4. 导入谷歌极客字体（Orbitron 用于标题，显得很科技感） -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- 5. 导入字体图标库（用来加小图标） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* -------------------- 全局重置 -------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 深邃的暗色背景，带一点紫色和青色渐变光晕 */
            background: #0a0e17;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(122, 75, 255, 0.08) 0%, transparent 40%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #ccd6f6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* -------------------- 顶部导航栏（磨砂玻璃效果） -------------------- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 14, 23, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            z-index: 999;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            letter-spacing: 2px;
        }
        .logo i {
            margin-right: 8px;
        }
        .nav-links a {
            color: #8892b0;
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .nav-links a:hover {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        /* -------------------- 主体卡片（磨砂玻璃容器） -------------------- */
        .hero-card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 3.5rem 3rem;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            margin-top: 2rem;
            transition: transform 0.3s ease;
        }
        .hero-card:hover {
            transform: scale(1.01);
        }

        /* 小标签（Badge） */
        .badge {
            display: inline-block;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 0.4rem 1.5rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #00f0ff;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        .badge i {
            margin-right: 6px;
        }

        /* 主标题（渐变色文字） */
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.8rem;
            line-height: 1.2;
            margin-bottom: 1rem;
            /* 炫酷的渐变文字 */
            background: linear-gradient(135deg, #ffffff 0%, #00f0ff 40%, #a855f7 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 副标题 */
        .sub-heading {
            font-size: 1.2rem;
            font-weight: 300;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .sub-heading i {
            color: #00f0ff;
            margin: 0 6px;
        }

        /* 分隔线（带发光效果） */
        .divider {
            width: 70px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
            margin: 1.8rem auto;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        /* 描述文字 */
        .description {
            font-size: 1rem;
            color: #94a3b8;
            line-height: 1.9;
            max-width: 600px;
            margin: 0 auto 1.5rem auto;
        }
        .description strong {
            color: #e2e8f0;
            font-weight: 600;
        }

        /* 社交图标区 */
        .social-links {
            display: flex;
            gap: 1.8rem;
            justify-content: center;
            margin-top: 2.5rem;
            flex-wrap: wrap;
        }
        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #8892b0;
            font-size: 1.4rem;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-decoration: none;
        }
        .social-links a:hover {
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.12);
            border-color: #00f0ff;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.2);
        }

        /* 页脚（底部版权） */
        .footer {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #334155;
            letter-spacing: 1px;
            font-weight: 400;
        }
        .footer a {
            color: #475569;
            text-decoration: none;
            transition: 0.3s;
        }
        .footer a:hover {
            color: #00f0ff;
        }

        /* -------------------- 手机适配 -------------------- */
        @media (max-width: 640px) {
            .navbar {
                padding: 0.8rem 1.5rem;
            }
            .nav-links a {
                margin-left: 1rem;
                font-size: 0.8rem;
            }
            .hero-card {
                padding: 2rem 1.5rem;
                border-radius: 20px;
            }
            .main-title {
                font-size: 2.2rem;
            }
            .sub-heading {
                font-size: 1rem;
            }
            .social-links a {
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="logo"><i class="fas fa-shield-halved"></i>Y11516</div>
        <div class="nav-links">
            <a href=" "><i class="fas fa-house"></i> 首页</a >
            <a href="#"><i class="fas fa-user"></i> 关于</a >
            <a href="#"><i class="fas fa-blog"></i> 笔记</a >
        </div>
    </nav>

    <!-- 主要展示卡片 -->
    <main class="hero-card">
        <!-- 小标签 -->
        <div class="badge">
            <i class="fas fa-bolt"></i> 零日防御 · 实验信安 2601
        </div>

        <!-- 主标题 -->
        <h1 class="main-title">
            Ready for the<br>Cybersecurity World
        </h1>

        <!-- 副标题 -->
        <p class="sub-heading">
            <i class="fas fa-terminal"></i> 
            I'm here. 
            <i class="fas fa-terminal"></i>
        </p >

        <!-- 装饰分隔线 -->
        <div class="divider"></div>

        <!-- 正文描述（把这里改成你自己的想法） -->
        <p class="description">
            
            <strong>「 以代码为盾，以逻辑为矛 」</strong> <br>
            从底层理解攻击，用严谨构建防御。这是我的第一个实验节点。
        </p >

        <!-- 社交媒体/联系方式图标（链接可换成你自己的） -->
        <div class="social-links">
            <a href="#" target="_blank" title="GitHub"><i class="fab fa-github"></i></a >
            <a href="#" target="_blank" title="CSDN/博客"><i class="fab fa-blogger"></i></a >
            <a href="#" target="_blank" title="邮件联系"><i class="fas fa-envelope"></i></a >
            <a href="#" target="_blank" title="B站/学习"><i class="fab fa-bilibili"></i></a >
        </div>
    </main>
     <a href="https://Y11516.github.io/first-post.html" style="color: #00f0ff; font-size: 1.1rem; display: inline-block; margin-top: 30px; border: 1px solid #00f0ff; padding: 10px 30px; border-radius: 30px; text-decoration: none; transition: 0.3s;">📖 阅读我的第一篇帖子</a >
    <a href="https://Y11516.github.io/ctf.html" style="color: #00f0ff; font-size: 1.1rem; display: inline-block; margin-top: 30px; border: 1px solid #00f0ff; padding: 10px 30px; border-radius: 30px; text-decoration: none; transition: 0.3s;">📚 进入 CTF 作战室</a >
    <!-- 底部版权 -->
    <div class="footer">
        <i class="fas fa-code"></i> 以代码为盾 · 
        <a href="https://Y11516.github.io" target="_blank">Y11516.github.io</a > · 
        <span id="year"></span>
    </div>

    <!-- 极简 JS：自动更新年份 -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

    
</body>
</html>
