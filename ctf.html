<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF 作战室 - Y11516</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            background-image: radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(122, 75, 255, 0.08) 0%, transparent 40%);
            min-height: 100vh; font-family: 'Inter', sans-serif; color: #ccd6f6;
            display: flex; flex-direction: column; align-items: center; padding: 6rem 1rem 4rem 1rem;
        }
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; padding: 1.2rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15); z-index: 999;
        }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.2rem; color: #00f0ff; letter-spacing: 2px; }
        .nav-links a { color: #8892b0; text-decoration: none; margin-left: 2rem; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: #00f0ff; }
        .container {
            max-width: 800px; width: 100%;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 32px;
            padding: 3rem; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }
        .header-title { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: #00f0ff; margin-bottom: 0.5rem; text-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .header-desc { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
        .platform-card {
            display: flex; flex-direction: column; gap: 8px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.2rem;
            text-decoration: none; color: inherit; transition: all 0.3s ease;
        }
        .platform-card:hover {
            background: rgba(0, 240, 255, 0.05); border-color: #00f0ff;
            transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 240, 255, 0.15);
        }
        .platform-title { font-size: 1.2rem; font-weight: 600; color: #e2e8f0; }
        .platform-desc { font-size: 0.85rem; color: #94a3b8; }
        .back-home { margin-top: 2rem; display: inline-block; text-decoration: none; color: #8892b0; font-size: 0.9rem; transition: 0.3s; }
        .back-home:hover { color: #00f0ff; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-shield-halved"></i> Y11516</div>
        <div class="nav-links">
            <a href="/"><i class="fas fa-house"></i> 返回首页</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="header-title"><i class="fas fa-bug"></i> CTF 作战室</h1>
        <p class="header-desc">每一次夺旗，都是一次成长的记录。请选择你要进入的靶场。</p>

        <!-- 平台入口 -->
        <a href="/bugku.html" class="platform-card">
            <span class="platform-title"><i class="fas fa-cube" style="color: #a855f7; margin-right: 8px;"></i>Bugku 题库</span>
            <span class="platform-desc">Web / MISC / Crypto / Reverse 综合靶场</span>
        </a>
        <a href="/ctfhub.html" class="platform-card">
            <span class="platform-title"><i class="fas fa-network-wired" style="color: #00f0ff; margin-right: 8px;"></i>CTFHub 技能树</span>
            <span class="platform-desc">信息泄露 / 目录遍历 / 请求方式等专项训练</span>
        </a>
        <a href="/pikachu.html" class="platform-card">
            <span class="platform-title"><i class="fas fa-crosshairs" style="color: #c084fc; margin-right: 8px;"></i>Pikachu 靶场</span>
            <span class="platform-desc">本地 Docker 搭建的 Web 漏洞实战演练平台</span>
        </a>
        
        <!-- 新增的两个靶场入口 -->
        <a href="/sqli-labs.html" class="platform-card">
            <span class="platform-title"><i class="fas fa-database" style="color: #f59e0b; margin-right: 8px;"></i>SQLi-Labs 靶场</span>
            <span class="platform-desc">SQL 注入专项训练，从联合查询到盲注</span>
        </a>
        <a href="/upload-labs.html" class="platform-card">
            <span class="platform-title"><i class="fas fa-file-upload" style="color: #10b981; margin-right: 8px;"></i>Upload-Labs 靶场</span>
            <span class="platform-desc">文件上传漏洞专项训练，涵盖多种绕过手法</span>
        </a>

        <!-- 进入工具箱按钮 -->
        <a href="/tools.html" style="color: #00f0ff; font-size: 1.1rem; display: inline-block; margin-top: 15px; border: 1px solid #00f0ff; padding: 10px 30px; border-radius: 30px; text-decoration: none; transition: 0.3s;">🧰 打开网安工具箱</a>

        <div style="text-align: center;">
            <a href="/" class="back-home"><i class="fas fa-arrow-left"></i> 返回主页</a>
        </div>
    </div>
</body>
</html>
