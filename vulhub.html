<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulhub 靶场 - Y11516</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17; 
            background-image: radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(122, 75, 255, 0.08) 0%, transparent 40%);
            min-height: 100vh; font-family: 'Inter', sans-serif; color: #ccd6f6;
            display: flex; flex-direction: column; align-items: center; padding: 6rem 1rem 4rem 1rem;
        }
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; padding: 1.2rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.15); z-index: 999;
        }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.2rem; color: #00f0ff; letter-spacing: 2px; }
        .nav-links a { color: #8892b0; text-decoration: none; margin-left: 2rem; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: #00f0ff; }
        
        .container {
            max-width: 800px; width: 100%;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 32px;
            padding: 3rem; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }
        
        .header-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
        }
        .header-title { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: #00f0ff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        
        /* 搜索框 */
        .search-container {
            display: flex; align-items: center; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
            padding: 8px 20px; margin-bottom: 1rem;
        }
        .search-container i { color: #64748b; margin-right: 10px; }
        .search-container input {
            background: transparent; border: none; color: #ccd6f6; width: 100%; outline: none;
        }

        /* 分类标签栏样式 */
        .filter-tabs {
            display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .filter-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #8892b0;
            padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.8rem;
            font-family: 'Inter', sans-serif; transition: all 0.3s; outline: none;
        }
        .filter-btn:hover { border-color: #00f0ff; color: #00f0ff; }
        .filter-btn.active { background: rgba(0, 240, 255, 0.15); border-color: #00f0ff; color: #00f0ff; font-weight: 600; }

        /* 题目卡片 */
        .assignment-card {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.2rem;
            text-decoration: none; color: inherit; transition: all 0.3s ease;
        }
        .assignment-card:hover {
            background: rgba(0, 240, 255, 0.05); border-color: #00f0ff;
            transform: translateY(-3px);
        }
        .card-left { display: flex; flex-direction: column; gap: 8px; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: #e2e8f0; }
        .card-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { font-size: 0.7rem; background: rgba(0, 240, 255, 0.1); padding: 4px 10px; border-radius: 12px; color: #00f0ff; border: 1px solid rgba(0, 240, 255, 0.2); }
        .tag.purple { background: rgba(168, 85, 247, 0.1); border-color: rgba(168, 85, 247, 0.3); color: #c084fc; }
        .tag.orange { background: rgba(249, 115, 22, 0.1); border-color: rgba(249, 115, 22, 0.3); color: #fdba74; }
        .card-right { color: #00f0ff; font-size: 1.2rem; }
        
        .back-home { margin-top: 2rem; display: inline-block; text-decoration: none; color: #8892b0; font-size: 0.9rem; transition: 0.3s; }
        .back-home:hover { color: #00f0ff; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fas fa-shield-halved"></i> Y11516</div>
        <div class="nav-links">
            <a href="/ctf.html"><i class="fas fa-arrow-left"></i> CTF 总库</a>
            <a href="/"><i class="fas fa-house"></i> 返回首页</a>
        </div>
    </nav>

    <div class="container">
        <!-- 标题 -->
        <div class="header-row">
            <h1 class="header-title"><i class="fas fa-cubes"></i> Vulhub 靶场</h1>
        </div>

        <!-- 搜索框 -->
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="搜索漏洞名字（例如：ThinkPHP）...">
        </div>

        <!-- 分类标签栏 -->
        <div class="filter-tabs">
            <button class="filter-btn active" data-type="all">ALL</button>
            <button class="filter-btn" data-type="php">PHP</button>
            <button class="filter-btn" data-type="java">Java</button>
            <button class="filter-btn" data-type="middleware">中间件</button>
            <button class="filter-btn" data-type="database">数据库</button>
        </div>

        <div id="card-list">
            <!-- Vulhub ThinkPHP 5 RCE -->
            <a href="/writeup-thinkphp-v5-rce.html" class="assignment-card" data-type="php">
                <div class="card-left">
                    <span class="card-title">ThinkPHP 5 远程代码执行漏洞（RCE）复现</span>
                    <div class="card-tags">
                        <span class="tag">Vulhub</span>
                        <span class="tag purple">PHP</span>
                        <span class="tag">RCE</span>
                        <span class="tag">框架漏洞</span>
                    </div>
                </div>
                <div class="card-right"><i class="fas fa-arrow-right"></i></div>
            </a>

            <!-- 预留其他 Vulhub 靶场卡片 -->
            <a href="#" class="assignment-card" data-type="java">
                <div class="card-left">
                    <span class="card-title">Log4j2 远程代码执行漏洞（CVE-2021-44228）</span>
                    <div class="card-tags">
                        <span class="tag">Vulhub</span>
                        <span class="tag purple">Java</span>
                        <span class="tag">JNDI注入</span>
                    </div>
                </div>
                <div class="card-right"><i class="fas fa-arrow-right"></i></div>
            </a>

            <a href="#" class="assignment-card" data-type="java">
                <div class="card-left">
                    <span class="card-title">Apache Shiro 反序列化漏洞（CVE-2016-4437）</span>
                    <div class="card-tags">
                        <span class="tag">Vulhub</span>
                        <span class="tag purple">Java</span>
                        <span class="tag">反序列化</span>
                    </div>
                </div>
                <div class="card-right"><i class="fas fa-arrow-right"></i></div>
            </a>
            
            <a href="#" class="assignment-card" data-type="middleware">
                <div class="card-left">
                    <span class="card-title">Apache HTTP Server 换行解析漏洞（CVE-2017-15715）</span>
                    <div class="card-tags">
                        <span class="tag">Vulhub</span>
                        <span class="tag purple">中间件</span>
                        <span class="tag">文件上传绕过</span>
                    </div>
                </div>
                <div class="card-right"><i class="fas fa-arrow-right"></i></div>
            </a>
        </div>
        
        <div style="text-align: center;">
            <a href="/ctf.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回 CTF 总库</a>
        </div>
    </div>

    <!-- ================= 搜索与分类过滤逻辑 ================= -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const filterBtns = document.querySelectorAll('.filter-tabs .filter-btn');
            const cards = document.querySelectorAll('.assignment-card');
            
            let activeType = 'all';
            let searchTerm = '';

            function updateCards() {
                cards.forEach(card => {
                    const cardType = card.dataset.type || 'all';
                    const title = card.querySelector('.card-title').textContent.toLowerCase();

                    const matchType = (activeType === 'all' || cardType === activeType);
                    const matchSearch = title.includes(searchTerm.toLowerCase());

                    if (matchType && matchSearch) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeType = btn.dataset.type;
                    updateCards();
                });
            });

            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value.trim();
                updateCards();
            });
        });
    </script>
</body>
</html>
