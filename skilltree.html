<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTFHub 技能树索引 - Y11516</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17; 
            background-image: radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 50%);
            min-height: 100vh; font-family: 'Inter', sans-serif; color: #ccd6f6;
            display: flex; justify-content: center; align-items: center; padding: 6rem 1rem 4rem 1rem;
        }

        /* 导航栏 */
        .navbar { position: fixed; top: 0; left: 0; width: 100%; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(10, 14, 23, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0, 240, 255, 0.15); z-index: 999; }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.2rem; color: #00f0ff; letter-spacing: 2px; }
        .nav-links a { color: #8892b0; text-decoration: none; margin-left: 2rem; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: #00f0ff; }

        /* 主容器 */
        .container {
            max-width: 900px; width: 100%;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 32px;
            padding: 3rem; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            position: relative; min-height: 400px; overflow: hidden;
        }

        /* 返回按钮 */
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: #8892b0; cursor: pointer; font-size: 0.9rem;
            padding: 6px 14px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; transition: all 0.3s; margin-bottom: 2rem;
            background: transparent; outline: none;
        }
        .back-btn:hover { color: #00f0ff; border-color: #00f0ff; background: rgba(0, 240, 255, 0.05); }
        .back-btn.hidden { display: none; }

        /* 标题 */
        .view-title {
            font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: #00f0ff;
            margin-bottom: 2rem; text-align: center; text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        /* 树状图容器 */
        .tree-view { display: flex; justify-content: center; padding: 2rem 0; }

        .tree ul { position: relative; padding-top: 20px; display: flex; justify-content: center; margin: 0; padding-left: 0; }
        .tree li { list-style-type: none; position: relative; padding: 20px 10px 0 10px; display: flex; flex-direction: column; align-items: center; }
        
        /* 树形连接线 */
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 1px solid rgba(255,255,255,0.15); width: 50%; height: 20px; }
        .tree li::after { right: auto; left: 50%; border-left: 1px solid rgba(255,255,255,0.15); }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 1px solid rgba(255,255,255,0.15); border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 1px solid rgba(255,255,255,0.15); width: 0; height: 20px; }

        /* 节点样式 - 完全复刻官方截图 */
        .node {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px 18px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s; position: relative; z-index: 2;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); user-select: none;
            min-width: 80px; text-align: center; border: 1px solid transparent;
        }
        .node:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4); }

        /* 官方配色：青色代表已掌握/当前，橙色代表未完成，灰色代表未学习/叶子 */
        .node.completed { background: #22d3ee; border-color: #22d3ee; color: #0a0e17; }
        .node.progress { background: #fbbf24; border-color: #fbbf24; color: #0a0e17; }
        .node.unlearned { background: #e2e8f0; border-color: #e2e8f0; color: #475569; }
        .node.leaf { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: #94a3b8; font-size: 0.75rem; min-width: 60px; padding: 8px 12px; }
        .node.leaf:hover { background: rgba(0, 240, 255, 0.1); border-color: #00f0ff; color: #00f0ff; }

        /* 提示 */
        .tip { text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 2rem; }
        .view-container { display: none; animation: fadeIn 0.4s ease; }
        .view-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 滚动条 */
        ::-webkit-scrollbar { height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0e17; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }
    </style>
</head>
<body>

                                { name: "Pwn", type: "unlearned", link: "#" },
                                { name: "Reverse", type: "unlearned", link: "#" },
                                { name: "Crypto", type: "unlearned", link: "#" },
                                { name: "Misc", type: "progress", link: "#" },
                                { name: "彩蛋", type: "unlearned", link: "#" },
                                { name: "BlockChain", type: "unlearned", link: "#" }
                            ]
                        }
                    ]
                }
            ]
        };

        // 状态管理
        let currentNodePath = []; // 记录路径，例如 ['CTF', '基础知识']
        const appContainer = document.getElementById('app');

        // 根据路径查找节点
        function findNodeByPath(node, path) {
            if (path.length === 0) return node;
            const nextName = path[0];
            if (node.children) {
                for (let child of node.children) {
                    if (child.name === nextName) {
                        return findNodeByPath(child, path.slice(1));
                    }
                }
            }
            return null;
        }

        // 渲染当前视图
        function renderView() {
            const currentNode = findNodeByPath(treeData, currentNodePath);
            if (!currentNode) return;

            // 准备HTML
            let html = `
                <button class="back-btn ${currentNodePath.length === 0 ? 'hidden' : ''}" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> 返回上一层
                </button>
                <h1 class="view-title">${currentNodePath.length === 0 ? 'CTF 技能树' : currentNodePath[currentNodePath.length - 1]}</h1>
                <div class="tree-view">
                    <div class="tree">
            `;

            // 递归渲染子节点
            if (currentNode.children && currentNode.children.length > 0) {
                html += `<ul>`;
                currentNode.children.forEach(child => {
                    html += `
                        <li>
                            <div class="node ${child.type === 'leaf' ? 'leaf' : child.type}" 
                                 onclick="handleNodeClick('${child.name}', ${child.children ? 'true' : 'false'}, '${child.link || '#'}')">
                                ${child.name}
                            </div>
                        </li>
                    `;
                });
                html += `</ul>`;
            } else {
                html += `<p style="color:#8892b0; text-align:center; padding: 2rem;">这里是最底层啦，没有更多子节点了。</p>`;
            }

            html += `
                    </div>
                </div>
            `;

            appContainer.innerHTML = html;
        }

        // 处理节点点击
        function handleNodeClick(name, hasChildren, link) {
            if (hasChildren) {
                // 有子节点，进入下一层（模拟页面跳转）
                currentNodePath.push(name);
                renderView();
            } else {
                // 没有子节点（叶子节点），直接跳转
                if (link && link !== '#') {
                    window.location.href = link;
                } else {
                    alert('此节点的 Writeup 还未完善，敬请期待！');
                }
            }
        }

        // 返回上一层
        function goBack() {
            if (currentNodePath.length > 0) {
                currentNodePath.pop();
                renderView();
            }
        }

        // 初始渲染
        renderView();
    </script>
</body>
</html>
